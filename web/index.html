<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="NYABAGAM - Context-First Long-Term Memory Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NYABAGAM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NYABAGAM</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #05060E;
      -webkit-tap-highlight-color: transparent;
    }
  </style>

  <script>
    window.nyabagamSpeech = {
      recognition: null,
      isListening: false,
      currentLang: 'en-IN',
      accumulatedFinal: '',

      cleanRepeatedPhrases: function(text) {
        if (!text) return '';
        // 1. Remove consecutive single duplicate words (case-insensitive)
        var words = text.split(/\s+/).filter(function(w) { return w.length > 0; });
        var dedup = [];
        for (var i = 0; i < words.length; i++) {
          if (dedup.length === 0 || dedup[dedup.length - 1].toLowerCase() !== words[i].toLowerCase()) {
            dedup.push(words[i]);
          }
        }
        
        // 2. Remove consecutive multi-word repeated phrases (length 2, 3, 4 words)
        // e.g. "my laptop my laptop" -> "my laptop"
        for (var phraseLen = 4; phraseLen >= 2; phraseLen--) {
          for (var start = 0; start <= dedup.length - 2 * phraseLen; start++) {
            var p1 = dedup.slice(start, start + phraseLen).join(' ').toLowerCase();
            var p2 = dedup.slice(start + phraseLen, start + 2 * phraseLen).join(' ').toLowerCase();
            if (p1 === p2 && p1.length > 0) {
              dedup.splice(start + phraseLen, phraseLen);
              start--;
            }
          }
        }
        return dedup.join(' ');
      },

      start: function(lang) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          console.warn('SpeechRecognition API is not supported in this browser.');
          window.dispatchEvent(new CustomEvent('nyabagam_speech_error', { detail: 'Speech recognition is not supported in this browser.' }));
          return false;
        }
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }
          var self = this;
          this.currentLang = lang || 'en-IN';
          this.accumulatedFinal = '';
          this.isListening = true;

          this.recognition = new SpeechRecognition();
          this.recognition.continuous = true;
          this.recognition.interimResults = true;
          this.recognition.lang = this.currentLang;
          this.recognition.maxAlternatives = 1;

          this.recognition.onresult = function(event) {
            var finalStr = '';
            var interimStr = '';
            for (var i = event.resultIndex; i < event.results.length; ++i) {
              var piece = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                finalStr += piece + ' ';
              } else {
                interimStr += piece;
              }
            }

            if (finalStr) {
              self.accumulatedFinal += finalStr;
            }

            var combined = (self.accumulatedFinal + interimStr).trim();
            var cleanTranscript = self.cleanRepeatedPhrases(combined);

            window.dispatchEvent(new CustomEvent('nyabagam_speech_result', { detail: cleanTranscript }));
          };

          this.recognition.onerror = function(event) {
            if (event.error !== 'no-speech') {
              console.warn('Speech recognition error:', event.error);
              window.dispatchEvent(new CustomEvent('nyabagam_speech_error', { detail: event.error }));
            }
          };

          this.recognition.onend = function() {
            if (self.isListening) {
              try {
                self.recognition.start();
              } catch(e) {
                self.isListening = false;
                window.dispatchEvent(new CustomEvent('nyabagam_speech_end'));
              }
            } else {
              window.dispatchEvent(new CustomEvent('nyabagam_speech_end'));
            }
          };

          this.recognition.start();
          return true;
        } catch (e) {
          console.error('Error starting speech:', e);
          this.isListening = false;
          return false;
        }
      },

      stop: function() {
        this.isListening = false;
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e) {}
        }
      }
    };
  </script>
</head>
<body>
  <!-- Renderer is pinned to CanvasKit in web/flutter_bootstrap.js. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
