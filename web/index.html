<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NYABAGAM - Context-First Long-Term Memory Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NYABAGAM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NYABAGAM</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.nyabagamSpeech = {
      recognition: null,
      isListening: false,
      start: function(lang) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          console.warn('SpeechRecognition API is not supported in this browser.');
          window.dispatchEvent(new CustomEvent('nyabagam_speech_error', { detail: 'Speech recognition is not supported in this browser. Please type your note.' }));
          return false;
        }
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }
          this.recognition = new SpeechRecognition();
          this.recognition.continuous = true;
          this.recognition.interimResults = true;
          this.recognition.lang = lang || navigator.language || 'en-US';

          this.recognition.onresult = function(event) {
            var fullTranscript = '';
            for (var i = 0; i < event.results.length; ++i) {
              fullTranscript += event.results[i][0].transcript;
            }
            window.dispatchEvent(new CustomEvent('nyabagam_speech_result', { detail: fullTranscript }));
          };

          this.recognition.onerror = function(event) {
            console.warn('Speech recognition error:', event.error);
            window.dispatchEvent(new CustomEvent('nyabagam_speech_error', { detail: event.error }));
          };

          this.recognition.onend = function() {
            window.nyabagamSpeech.isListening = false;
            window.dispatchEvent(new CustomEvent('nyabagam_speech_end'));
          };

          this.recognition.start();
          this.isListening = true;
          return true;
        } catch (e) {
          console.error('Error starting speech:', e);
          return false;
        }
      },
      stop: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e) {}
          this.isListening = false;
        }
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
