<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="NYABAGAM - Context-First Long-Term Memory Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NYABAGAM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NYABAGAM</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts for elevated typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #090D16;
      -webkit-tap-highlight-color: transparent;
    }
  </style>

  <script>
    window.nyabagamSpeech = {
      recognition: null,
      isListening: false,
      finalTranscript: '',
      currentLang: 'en-IN',
      start: function(lang) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          console.warn('SpeechRecognition API is not supported in this browser.');
          window.dispatchEvent(new CustomEvent('nyabagam_speech_error', { detail: 'Speech recognition is not supported in this browser.' }));
          return false;
        }
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }
          this.finalTranscript = '';
          this.currentLang = lang || 'en-IN';
          this.recognition = new SpeechRecognition();
          this.recognition.continuous = true;
          this.recognition.interimResults = true;
          this.recognition.lang = this.currentLang;

          this.recognition.onresult = function(event) {
            var interim = '';
            for (var i = event.resultIndex; i < event.results.length; ++i) {
              var piece = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                window.nyabagamSpeech.finalTranscript += piece + ' ';
              } else {
                interim += piece;
              }
            }
            var output = (window.nyabagamSpeech.finalTranscript + interim).trim();
            window.dispatchEvent(new CustomEvent('nyabagam_speech_result', { detail: output }));
          };

          this.recognition.onerror = function(event) {
            console.warn('Speech recognition error:', event.error);
            window.dispatchEvent(new CustomEvent('nyabagam_speech_error', { detail: event.error }));
          };

          this.recognition.onend = function() {
            window.nyabagamSpeech.isListening = false;
            window.dispatchEvent(new CustomEvent('nyabagam_speech_end'));
          };

          this.recognition.start();
          this.isListening = true;
          return true;
        } catch (e) {
          console.error('Error starting speech:', e);
          return false;
        }
      },
      stop: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e) {}
          this.isListening = false;
        }
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
